name: E2E

# Browser e2e against a real (emulated) KubeVirt: kind + KubeVirt with
# useEmulation (no KVM on GitHub runners) + CDI. Runs every Playwright test
# not tagged @live-only — wizard flows, catalog content, every create source
# type, scale, and one full boot lifecycle (cirros under TCG).
# The @live-only tier (consoles, SSH, RDP probe, snapshots, bootc, boot-from-
# import) needs the production cluster: see e2e/README in corral.spec.js.

on:
  push:
    branches: [main]
  # Only run the (expensive) browser e2e when something that affects runtime
  # behaviour changes — Go code, the served UI, the e2e specs themselves, or the
  # deploy manifests. Docs/marketplace/CI-config-only PRs skip it.
  # The `changes` job below holds the filter. It drops Go that cannot change
  # the `corral web` this job drives: tests, the TUI, the plugin binaries
  # (cmd/corral-*), and the pkg/ trees the corral binary does not import
  # (`go list -tags bootc -deps .`). Every push to main runs the whole suite.
  pull_request:
  workflow_dispatch:

# Least privilege by default: the read-only token is all any job here needs
# unless it says otherwise, and a job that needs more grants it for itself.
permissions:
  contents: read

env:
  # Reverted v1.9.0-beta.0 (see git history on this line for that attempt) —
  # it made things worse: the containerDisk lifecycle test went from
  # printableStatus stuck at "Starting" (v1.8.2) to the virt-launcher pod
  # actually CrashLoopBackOff-ing under useEmulation. That's a real
  # regression in the beta release's software-emulation path, not fixed by
  # any timeout. corral.spec.js's kernelBootStatus checksum bug (see
  # pkg/kubevirt/client.go's launcherRunningFn comment) turned out not to be
  # this test's issue either — that bug is scoped to kernelBoot VMs
  # specifically, and this test uses a plain containerDisk. Root cause of
  # the v1.8.2 "stuck at Starting" behavior is still open; see #77.
  KUBEVIRT_VERSION: v1.8.2
  CDI_VERSION: v1.62.0
  KIND_VERSION: v0.30.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The path filter lives in a job, not under `on.pull_request.paths`, so that
  # `e2e-kind` can be a required check. A workflow that a path filter skips
  # never reports, and a required check that never reports blocks the merge.
  # A job that its `if:` skips reports success.
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo run=true >>"$GITHUB_OUTPUT"; exit 0
          fi
          run=false
          while IFS= read -r f; do
            case "$f" in
              *_test.go|cmd/tui*.go|cmd/corral-*/*|pkg/device/*|pkg/lifecycle/*|pkg/schedule/*|pkg/testenv/*) continue ;;
            esac
            case "$f" in
              *.go|go.mod|go.sum|e2e/*|pkg/web/static/*|deploy/*|Containerfile|.github/workflows/e2e.yml|scripts/e2e-vdi.sh) run=true ;;
            esac
          done < <(git diff --name-only "$BASE"...HEAD)
          echo "run=$run" | tee -a "$GITHUB_OUTPUT"

  e2e-kind:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Create kind cluster
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          kind create cluster --wait 120s

      - name: Install KubeVirt (software emulation)
        run: |
          kubectl create -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-operator.yaml"
          kubectl create -f "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/kubevirt-cr.yaml"
          kubectl -n kubevirt patch kubevirt kubevirt --type merge \
            -p '{"spec":{"configuration":{"developerConfiguration":{"useEmulation":true}}}}'
          kubectl -n kubevirt wait kv/kubevirt --for condition=Available --timeout=10m

      - name: Install CDI
        run: |
          kubectl create -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-operator.yaml"
          kubectl create -f "https://github.com/kubevirt/containerized-data-importer/releases/download/${CDI_VERSION}/cdi-cr.yaml"
          kubectl wait cdi cdi --for=condition=Available --timeout=10m

      - name: Install virtctl
        run: |
          curl -fsSLo virtctl "https://github.com/kubevirt/kubevirt/releases/download/${KUBEVIRT_VERSION}/virtctl-${KUBEVIRT_VERSION}-linux-amd64"
          chmod +x virtctl && sudo mv virtctl /usr/local/bin/virtctl

      - name: Build and start corral web
        run: |
          go build -tags bootc -o corral .
          kubectl create namespace corral-vms
          CORRAL_DEFAULT_BACKEND=kubevirt ./corral web --addr 127.0.0.1:8006 > corral-web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8006/api/capabilities && break
            sleep 1
          done

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e (CI tier)
        working-directory: e2e
        env:
          # cirros boots fast enough under TCG; fedora would not
          E2E_CONTAINERDISK: quay.io/kubevirt/cirros-container-disk-demo:latest
          CORRAL_NS: corral-vms
        run: npx playwright test --grep-invert "@live-only" --reporter=line

      # The VDI broker (#227–#229) on its own corral web instance: claim,
      # ownership, connect, release, and reclaim against real Leases.
      - name: VDI broker e2e
        env:
          E2E_CONTAINERDISK: quay.io/kubevirt/cirros-container-disk-demo:latest
          CORRAL_NS: corral-vms
        run: scripts/e2e-vdi.sh ./corral

      - name: Verify cleanup left nothing behind
        if: always()
        run: |
          leftovers=$(kubectl get vm,dv -n corral-vms -o name 2>/dev/null || true)
          ct_leftovers=$(kubectl get pvc,pod -n corral-vms -l corral.dev/ct=true -o name 2>/dev/null || true)
          leftovers="$leftovers$ct_leftovers"
          if [ -n "$leftovers" ]; then
            echo "e2e left resources behind:"; echo "$leftovers"; exit 1
          fi

      - name: Server log
        if: failure()
        run: tail -100 corral-web.log

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
