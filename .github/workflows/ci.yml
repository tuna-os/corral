name: CI

on:
  push:
    branches: [main]
  # The fast gate (gofmt/vet/build/test -race) runs on EVERY PR — it is the
  # required status check that auto-merge waits on, and a required check that
  # gets path-filtered out never reports, deadlocking the merge. ~2 min on a
  # docs-only PR is the price of auto-merge meaning something.
  pull_request:
  workflow_dispatch:

# Least privilege by default: the read-only token is all any job here needs
# unless it says otherwise, and a job that needs more grants it for itself.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/corral
  KUBECTL_VERSION: v1.36.1
  VIRTCTL_VERSION: v1.8.2

# A PR's newer push cancels its older run. On main every merge gets its own run
# (keyed by sha) and the dedupe happens per job instead (`concurrency` on each
# job, keyed by job + ref): at most one running and one pending of each job, a
# newer pending one replaces an older one, and nothing in progress is cancelled.
# A run-wide group starved publishing: every merge replaced the pending run, so
# under a busy runner queue publish-plugins went hours without running.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-qemu-lifecycle:
    name: Native QEMU lifecycle (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15-intel
            arch: amd64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install native QEMU
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install qemu
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf
            if [[ "$RUNNER_ARCH" == ARM64 ]]; then
              sudo apt-get install -y -qq qemu-system-arm
            fi
          fi
      - name: Record native tool and source identities
        shell: bash
        run: |
          mkdir -p native-qemu-evidence
          {
            git rev-parse HEAD
            uname -a
            go version
            go env GOOS GOARCH
            test "$(go env GOARCH)" = "${{ matrix.arch }}"
            if [[ "$(uname -m)" == arm64 || "$(uname -m)" == aarch64 ]]; then
              qemu-system-aarch64 --version
              shasum -a 256 "$(command -v qemu-system-aarch64)"
            else
              qemu-system-x86_64 --version
              shasum -a 256 "$(command -v qemu-system-x86_64)"
            fi
          } | tee native-qemu-evidence/identities.txt
      # This drives real native QEMU's QMP and OS process retirement, not a
      # stub or cross-compile. This is empty-disk backend qualification, NOT a
      # claim of Tuna image boot, firstboot/login or browser admission.
      - name: Exercise native process ownership and retirement
        env:
          CORRAL_REQUIRE_TOOLS: qemu
        shell: bash
        run: |
          set -o pipefail
          go test -json -count=1 -timeout 90s ./pkg/qemu -run 'Test(StartDirect_|StopDirect_|AccelArgsFor_)' | tee native-qemu-evidence/tests.jsonl
      - name: Exercise canonical CLI wait and owned UEFI retirement
        shell: bash
        run: |
          set -euo pipefail
          corral="$RUNNER_TEMP/corral-native-cli"
          go build -trimpath -o "$corral" .
          guest_arches=(amd64)
          if [[ "$RUNNER_OS" == macOS && "$RUNNER_ARCH" == X64 ]]; then
            guest_arches+=(arm64)
          fi
          for guest_arch in "${guest_arches[@]}"; do
          name="canonical-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence=native-qemu-evidence
          if [[ "$guest_arch" == arm64 ]]; then
            name="$name-arm64"
            evidence="$evidence/arm64"
          fi
          mkdir -p "$evidence"
          ref="qemu//local/$name"
          serial="$HOME/.local/share/corral/vms/$name/serial.log"
          created=0
          cleanup() {
            result=$?
            trap - EXIT INT TERM HUP
            if [[ "$created" == 1 ]]; then
              if [[ -f "$serial" ]]; then
                cp "$serial" "$evidence/cli-serial.log" || result=1
              fi
              "$corral" --backend qemu stop "$ref" >>"$evidence/cli-cleanup.log" 2>&1 || result=1
              "$corral" --backend qemu delete "$ref" --force >>"$evidence/cli-cleanup.log" 2>&1 || result=1
            fi
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          trap 'exit 129' HUP
          created=1
          "$corral" --backend qemu create "$name" --firmware uefi --arch "$guest_arch" --loopback --disk 64M --mem 256M --cpu 1
          python3 - "$ref" <<'PY'
          import json, pathlib, sys
          registry = pathlib.Path.home() / ".local/share/corral/registry.json"
          assert sys.argv[1] in json.loads(registry.read_text()), "actual CLI create omitted its inventory-scoped registry identity"
          PY
          if [[ "$guest_arch" == arm64 ]]; then
            # No firmware override or OS image: exercise production Intel
            # Homebrew discovery and its private, copied ARM variable store.
            cmp /usr/local/share/qemu/edk2-arm-vars.fd "$HOME/.local/share/corral/vms/$name/vars.fd"
            shasum -a 256 /usr/local/share/qemu/edk2-{aarch64-code,arm-vars}.fd >"$evidence/firmware-sha256.txt"
            qemu-system-aarch64 --version >"$evidence/qemu-version.txt"
          fi
          "$corral" --backend qemu start "$ref"
          # Paint is a point-in-time framebuffer observation, not a firmware
          # milestone: QEMU's initial host-rendered 640x480 "Guest has not
          # initialized the display (yet)." surface is itself nonuniform.
          # ARM UEFI then replaces it with a blank 1280x800 GOP surface.
          # Qualify the actual guest console before measuring its paint,
          # sharing the existing 30s deadline rather than adding a new one.
          if [[ "$guest_arch" == arm64 ]]; then
            python3 - "$corral" "$ref" "$serial" "$evidence" <<'PY'
          import json, pathlib, re, subprocess, sys, time
          corral, ref, serial, evidence = sys.argv[1:]
          started = time.monotonic()
          deadline = started + 30
          serial = pathlib.Path(serial)
          evidence = pathlib.Path(evidence)
          # EDK2 PlatformBmPrintScLib prints these boot-option preparations
          # through ConOut after PlatformBootManagerAfterConsole, not through
          # the early debug UART before graphical console initialization.
          milestone = re.compile(rb"BdsDxe: (?:loading|starting) Boot[0-9A-Fa-f]{4}[^\r\n]*[\r\n]")
          while True:
              data = serial.read_bytes() if serial.exists() else b""
              match = milestone.search(data)
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("ARM UEFI did not initialize its boot-manager console within 30s; see cli-serial.log")
              if match:
                  (evidence / "cli-firmware-ready.json").write_text(json.dumps({
                      "condition": "UEFI boot-manager console initialized",
                      "observed": match.group().decode("utf-8", errors="replace").strip(),
                      "elapsed_seconds": time.monotonic() - started,
                  }, indent=2) + "\n")
                  break
              time.sleep(min(0.1, remaining))
          with (evidence / "cli-wait.json").open("w") as output:
              subprocess.run([corral, "--backend", "qemu", "--json", "wait", ref,
                              "--paint", "--timeout", f"{deadline - time.monotonic():.9f}s",
                              "--interval", "100ms"], stdout=output, check=True)
          PY
          else
            "$corral" --backend qemu --json wait "$ref" --paint --timeout 30s --interval 100ms >"$evidence/cli-wait.json"
          fi
          # Firmware output qualifies this API regression only, not a guest
          # OS boot, Tuna session, firstboot/login or browser admission.
          "$corral" --backend qemu info "$ref" >"$evidence/cli-info.json"
          "$corral" --backend qemu qmp "$ref" query-target >"$evidence/cli-target.json"
          "$corral" --backend qemu qmp "$ref" query-kvm >"$evidence/cli-kvm.json"
          "$corral" --backend qemu qmp "$ref" query-block >"$evidence/cli-blocks.json"
          if [[ "$guest_arch" == arm64 ]]; then
            "$corral" --backend qemu qmp "$ref" human-monitor-command '{"command-line":"info jit"}' >"$evidence/cli-tcg.json"
          fi
          python3 - "$corral" "$guest_arch" "$evidence" "$name" <<'PY'
          import hashlib, json, os, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[3])
          guest_arch = sys.argv[2]
          info = json.loads((root / "cli-info.json").read_text())
          target = json.loads((root / "cli-target.json").read_text())
          kvm = json.loads((root / "cli-kvm.json").read_text())
          blocks = json.loads((root / "cli-blocks.json").read_text())
          target_arch = "aarch64" if guest_arch == "arm64" else "x86_64"
          assert info["architecture"] == guest_arch and target["arch"] == target_arch
          assert info["firmware"] == "uefi"
          if guest_arch == "arm64":
              assert info["acceleration"] == "tcg"
              assert "Translation buffer state" in json.loads((root / "cli-tcg.json").read_text()), "running QEMU lacks TCG translation buffer"
          elif os.environ["RUNNER_ARCH"] == "ARM64":
              assert info["acceleration"] == "tcg"
          elif os.environ["RUNNER_OS"] == "macOS":
              assert info["acceleration"] == "hvf"
          else:
              assert info["acceleration"] in {"kvm", "tcg"}
          assert kvm["enabled"] is (info["acceleration"] == "kvm")
          code = [item["inserted"]["image"]["filename"] for item in blocks
                  if item.get("inserted", {}).get("ro") is True
                  and item["inserted"].get("drv") == "raw"
                  and item["inserted"].get("image", {}).get("filename", "").endswith(".fd")]
          assert len(code) == 1, "running VM lacks one actual read-only UEFI flash image"
          firmware = pathlib.Path(code[0])
          if guest_arch == "arm64":
              assert firmware.resolve() == pathlib.Path("/usr/local/share/qemu/edk2-aarch64-code.fd").resolve()
              private_vars = pathlib.Path.home() / ".local/share/corral/vms" / sys.argv[4] / "vars.fd"
              assert any(item.get("inserted", {}).get("ro") is False
                         and pathlib.Path(item["inserted"]["image"]["filename"]) == private_vars
                         for item in blocks if item.get("inserted", {}).get("image", {}).get("filename")), "running QEMU lacks its owned ARM variable store"
          qemu = pathlib.Path(shutil.which("qemu-system-" + target_arch)).resolve()
          receipt = {"host": os.environ["RUNNER_OS"], "hostArchitecture": os.environ["RUNNER_ARCH"],
                     "guestArchitecture": target["arch"], "acceleration": info["acceleration"],
                     "firmwareCode": str(firmware), "firmwareCodeSha256": hashlib.sha256(firmware.read_bytes()).hexdigest(),
                     "qemuSha256": hashlib.sha256(qemu.read_bytes()).hexdigest(),
                     "corralSha256": hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest(),
                     "scope": "native CLI and UEFI execution only; no guest OS, Tuna login or browser proof"}
          (root / "cli-runtime.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
          "$corral" --backend qemu screenshot "$ref" --require-paint -o "$evidence/cli-firmware.png"
          cp "$serial" "$evidence/cli-serial.log"
          "$corral" --backend qemu stop "$ref"
          "$corral" --backend qemu delete "$ref" --force
          test ! -e "$HOME/.local/share/corral/vms/$name"
          test ! -e "$HOME/.config/systemd/user/corral-$name.service"
          python3 - "$ref" <<'PY'
          import json, pathlib, sys
          registry = pathlib.Path.home() / ".local/share/corral/registry.json"
          assert sys.argv[1] not in json.loads(registry.read_text()), "actual CLI delete retained its scoped registry data"
          PY
          created=0
          printf '{"ref":"%s","stopped":true,"deleted":true,"vmDirectoryRemoved":true,"unitRemoved":true}\n' "$ref" >"$evidence/cli-cleanup.json"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-qemu-${{ matrix.os }}
          path: native-qemu-evidence/

  test:
    concurrency:
      group: ${{ github.workflow }}-test-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Real-tool tests (qcow2 conversion, rclone round-trip) run here instead of
      # skipping — see TestConvertRawToQcow2_Real / TestRclone_RealCopytoRoundTrip.
      - name: Install test tools (qemu-img, rclone, ovmf)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils rclone ovmf

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags bootc ./...

      - name: go build
        run: |
          go build ./...
          go build -tags bootc ./...

      # -shuffle=on: the suite shares process-global seams (SetRunner, package
      # stores, environment), so a test that only passes because another ran
      # first is a real risk. Randomising the order surfaces that instead of
      # letting it hide until someone adds a test in the middle.
      - name: go test (race, shuffled)
        env:
          # The step above installs these on purpose, so a test that skips for
          # a missing one is a broken runner, not an inapplicable test
          # (pkg/testenv).
          CORRAL_REQUIRE_TOOLS: qemu-img,rclone
        run: go test -race -shuffle=on -count=1 -timeout 300s ./...

      - name: go test (bootc tag)
        run: go test -tags bootc -race -shuffle=on -count=1 -timeout 300s ./...

      - name: coverage
        run: |
          go test -count=1 -timeout 300s -coverprofile=cover.out ./...
          # Ratchet: fails if the total slips below .coverage-budget.
          scripts/coverage-gate.sh cover.out | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo '### Test coverage'
            echo '```'
            go tool cover -func=cover.out | tail -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Per-package report (RFC-0004 slice 4): informational only, exits 0,
      # so it never fails the build. Consumes the same cover.out.
      - name: coverage by package
        run: scripts/coverage-report.sh cover.out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: cover.out

  lint:
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # golangci-lint, which this repo has had a config for and never run.
    #
    # Two gates, because a mature codebase cannot adopt a linter in one step
    # without either a 700-line mechanical diff or an ignored red X:
    #   1. everything except errcheck must be clean repo-wide, and is today;
    #   2. errcheck runs on the diff only, so new code cannot add unchecked
    #      errors while the existing backlog is paid down separately.
    # This is the same ratchet idea as .ste-budget: seed at today's state,
    # never let it get worse.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # --new-from-merge-base needs the history the merge base lives in.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      # Installed from source rather than through the marketplace action: the
      # binary must be built with a Go at least as new as go.mod's directive,
      # and this way the toolchain already set up above is the one used.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

      - name: Lint (repo-wide)
        run: golangci-lint run --disable=errcheck ./...

      - name: Lint new code (errcheck)
        run: |
          base="origin/${{ github.base_ref || 'main' }}"
          git fetch --quiet origin "${{ github.base_ref || 'main' }}"
          golangci-lint run --default=none --enable=errcheck --new-from-merge-base="$base" ./...

  publish-image:
    # corral-web image: the web UI served on the cluster (deploy/corral-web.yaml)
    # Only main may publish the rolling image. Manual dispatches on catalog
    # branches run verification without replacing production.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: ${{ github.workflow }}-publish-image-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore keyless signing of the pushed image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build binary and fetch kubectl/virtctl
        run: |
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            # bootc tag included: the on-cluster web UI must offer the bootc
            # create flow (build a container image into a VM disk).
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -tags bootc -ldflags="-s -w" -o "build/$arch/corral" .
            curl -fsSLo "build/$arch/kubectl" \
              "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/$arch/kubectl"
            curl -fsSLo "build/$arch/virtctl" \
              "https://github.com/kubevirt/kubevirt/releases/download/${VIRTCTL_VERSION}/virtctl-${VIRTCTL_VERSION}-linux-$arch"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract container metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Keyless signature and one SPDX SBOM attestation per platform, all on
      # the pushed index digest (never a tag), verified with the exact
      # identity before the job succeeds (docs/enterprise-readiness.md).
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.ref == 'refs/heads/main'
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: github.ref == 'refs/heads/main'
        id: syft
      - name: Sign image and attest SBOMs
        if: github.ref == 'refs/heads/main'
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
          SIGNER_ISSUER: https://token.actions.githubusercontent.com
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign "$REF"
          for platform in linux/amd64 linux/arm64; do
            sbom="sbom-${platform//\//-}.spdx.json"
            "$SYFT" scan "registry:$REF" --platform "$platform" -o "spdx-json=$sbom"
            jq -e '.spdxVersion and (.packages | length > 0)' "$sbom" >/dev/null
            cosign attest --type spdxjson --predicate "$sbom" "$REF"
          done
          cosign verify "$REF" \
            --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$SIGNER_ISSUER" >/dev/null
          cosign verify-attestation "$REF" --type spdxjson \
            --certificate-identity "$SIGNER_IDENTITY" --certificate-oidc-issuer "$SIGNER_ISSUER" >/dev/null
          echo "Signed and attested $REF"

  web-image-smoke:
    concurrency:
      group: ${{ github.workflow }}-web-image-smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    # Container image build + probe smoke for docs/deployment-modes.md mode 2.
    # scripts/smoke-web-image.sh builds the image from the Containerfile,
    # boots it, and curls /healthz + /readyz. No VPN or live cluster needed.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build image and smoke-test probes
        run: ./scripts/smoke-web-image.sh

      # publish-image builds amd64 and arm64 on main; this keeps a PR from
      # breaking the arm64 binary that image (and release-binaries) ships.
      - name: Cross-build arm64 (bootc tag)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -tags bootc -o /dev/null .

  release-binaries:
    # Publishes static binaries to a rolling "binaries" release so consumers
    # (e.g. the dotfiles ansible role) can fetch a stable URL:
    # https://github.com/tuna-os/corral/releases/download/binaries/corral-<os>-<arch>
    needs: test
    # Main only: the binaries are signed as ci.yml@refs/heads/main, the
    # identity scripts/install.sh pins; a dispatch from a branch would put
    # binaries under the rolling URL that no verifier accepts.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: ${{ github.workflow }}-release-binaries-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write # Sigstore keyless signing; this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags, so `git describe` can stamp a real version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      - name: Build static binaries
        run: |
          mkdir -p dist
          # Stamp a real version so plugins that require a minimum corral (and
          # `corral version`) see something meaningful instead of the v0.0.0
          # pseudo-version a bare `go build` produces. git-describe's
          # "v0.4.0-5-g<sha>" becomes semver build metadata "v0.4.0+5.g<sha>",
          # which compares equal to v0.4.0 for constraint checks.
          # --match 'v*' is load-bearing. publish-plugins tags every push to main
          # as plugins-<sha>, and those now outnumber the release tags 106 to 9,
          # so a bare `git describe --tags` always lands on one: this stamped
          # "plugins-45109e27...+2.gb48539b", which is not a version at all.
          # Matching v* walks past them to the real release tag.
          VERSION="$(git describe --tags --always --dirty --match 'v*' 2>/dev/null | sed -E 's/-([0-9]+)-g/+\1.g/')"
          echo "Stamping version: ${VERSION:-<empty>}"
          # macOS is built because the installer and the README both offer it.
          # Until now they offered a URL that did not exist: scripts/install.sh
          # maps Darwin to darwin and then fetched an asset this job never
          # produced, so the documented one-liner 404'd on every Mac.
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -ldflags="-s -w -X github.com/tuna-os/corral/cmd.version=${VERSION}" -o "dist/corral-$os-$arch" .
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      # SHA256SUMS above covers the binaries only; the sidecars this writes
      # (.sigstore.json, .spdx.json, .sbom.sigstore.json) ship beside them.
      - name: Sign binaries and attest SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: scripts/sign-release-assets.sh "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main" dist/corral-*-amd64 dist/corral-*-arm64

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corral-binaries
          path: dist/

      - name: Publish to the rolling "binaries" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view binaries >/dev/null 2>&1 \
            || gh release create binaries --title "Corral binaries" \
                 --notes "Rolling release of corral binaries built from main (auto-updated by CI)." --latest=false
          gh release upload binaries dist/* --clobber

  publish-plugins:
    # Builds marketplace plugin binaries and publishes them to a rolling
    # "plugins" release that marketplace/index.json points at.
    #
    # Every artifact is signed keylessly (Sigstore, GitHub OIDC; no stored key,
    # per tunaos#1187 and docs/enterprise-readiness.md) and carries an SPDX
    # SBOM bound to its digest by a signed attestation. Next to each
    # corral-<plugin>-linux-<arch> the release holds:
    #   .sigstore.json       signature bundle over the binary
    #   .spdx.json           the SBOM itself, for humans
    #   .sbom.sigstore.json  signed in-toto attestation: SBOM -> binary digest
    # The signer identity is this workflow on refs/heads/main, so the job runs
    # only there: a dispatch from another branch would publish artifacts that
    # no verifier pinned to main accepts — and would move the rolling index.
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Its own group, so a publish that has started always finishes and the
    # newest pending one always runs next (a rolling release wants the newest).
    concurrency:
      group: ${{ github.workflow }}-publish-plugins-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write # Sigstore keyless signing; this job only
    env:
      SIGNER_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main
      SIGNER_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      - name: Build marketplace plugins (linux amd64 + arm64)
        run: |
          mkdir -p plugins-dist
          for plugin in bootc snapsched schedule gpu windows proxmox backup auth vdi; do
            tags=""
            [ "$plugin" = bootc ] && tags="-tags bootc"
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=linux GOARCH=$arch \
                go build $tags -ldflags="-s -w" \
                -o "plugins-dist/corral-$plugin-linux-$arch" "./cmd/corral-$plugin"
            done
          done
          chmod +x scripts/generate-marketplace.sh
          scripts/generate-marketplace.sh plugins-dist "plugins-${GITHUB_SHA}" plugins-dist/marketplace-index.json
          ls -lh plugins-dist/

      - name: SBOM, sign and attest every plugin artifact, then verify
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for bin in plugins-dist/corral-*-linux-amd64 plugins-dist/corral-*-linux-arm64; do
            "$SYFT" scan "file:$bin" -o "spdx-json=$bin.spdx.json"
            jq -e '.spdxVersion and (.packages | length > 0)' "$bin.spdx.json" >/dev/null
            cosign sign-blob --bundle "$bin.sigstore.json" "$bin"
            cosign attest-blob --type spdxjson --predicate "$bin.spdx.json" \
              --bundle "$bin.sbom.sigstore.json" "$bin"
            # Fail closed: verify with the exact identity a client pins
            # before anything is published.
            cosign verify-blob --bundle "$bin.sigstore.json" \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" "$bin"
            cosign verify-blob-attestation --bundle "$bin.sbom.sigstore.json" --type spdxjson \
              --certificate-identity "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" "$bin"
          done

      - name: Publish immutable plugin release and rolling channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="plugins-${GITHUB_SHA}"
          gh release create "$tag" plugins-dist/corral-* \
            --title "Corral plugins ${GITHUB_SHA::12}" \
            --notes "Immutable marketplace plugin artifacts for ${GITHUB_SHA}. Each binary has a Sigstore bundle (.sigstore.json), an SPDX SBOM (.spdx.json) and a signed SBOM attestation (.sbom.sigstore.json); see docs/plugin-marketplace.md to verify." \
            --latest=false
          gh release view plugins >/dev/null 2>&1 \
            || gh release create plugins --title "Corral plugin channel" \
                 --notes "Rolling signed/checksummed marketplace manifest; artifacts are immutable releases." --latest=false
          gh release upload plugins plugins-dist/marketplace-index.json --clobber
