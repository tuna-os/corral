name: Release

# Attaches signed binaries to the GitHub Release of a version tag. Pushing
# the tag is the whole release step: this creates the Release from
# docs/releases/<tag>.md when it does not exist yet, or adds the assets to
# the one a maintainer created first.
#
# Each corral-<os>-<arch> is keylessly signed (Sigstore, GitHub OIDC; no
# stored key) as this workflow on that tag, and carries an SPDX SBOM bound to
# its digest by a signed attestation. scripts/sign-release-assets.sh verifies
# both with the exact identity before anything is uploaded; see
# docs/enterprise-readiness.md and the verification commands in README.md.

on:
  push:
    tags: ["v*"]

# Least privilege by default: the read-only token is all any job here needs
# unless it says otherwise, and a job that needs more grants it for itself.
permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write # Sigstore keyless signing; this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft

      - name: Build static binaries
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                go build -ldflags="-s -w -X github.com/tuna-os/corral/cmd.version=${GITHUB_REF_NAME}" -o "dist/corral-$os-$arch" .
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Sign binaries and attest SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: scripts/sign-release-assets.sh "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" dist/corral-*-amd64 dist/corral-*-arm64

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            notes="docs/releases/$tag.md"
            if [ -f "$notes" ]; then
              gh release create "$tag" --verify-tag --title "Corral $tag" --notes-file "$notes"
            else
              gh release create "$tag" --verify-tag --title "Corral $tag" --generate-notes
            fi
          fi
          gh release upload "$tag" dist/* --clobber
