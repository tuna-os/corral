# Browser demo site (#284): the dashboard compiled to WebAssembly, served by a
# service worker against the in-memory demo cluster. See web-demo/README.md.
#
# Every run builds the site, so a change that breaks the js/wasm build fails
# here. Pushes to main also publish it to GitHub Pages, but only once a
# maintainer opts in: Pages source set to "GitHub Actions" and the repository
# variable CORRAL_WEB_DEMO_PAGES set to "true".
name: web-demo

# The paths below are the js/wasm build's inputs. The "!" lines drop what
# cannot change it: Go tests, and the pkg/ trees cmd/corral-wasm does not
# import (`GOOS=js GOARCH=wasm go list -deps ./cmd/corral-wasm`). Re-check that
# list when cmd/corral-wasm gains an import.
on:
  push:
    branches: [main]
    paths:
      - "cmd/corral-wasm/**"
      - "pkg/**"
      - "web-demo/**"
      - "scripts/build-web-demo.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-demo.yml"
      - "!**_test.go"
      - "!pkg/device/**"
      - "!pkg/lifecycle/**"
      - "!pkg/schedule/**"
      - "!pkg/setup/**"
      - "!pkg/testenv/**"
      - "!pkg/vdi/**"
      - "!pkg/vmtest/**"
  # A pull request builds the site only when it touches the demo itself, the
  # web client or the demo cluster. Other pkg/ changes are built by the push to
  # main and by the nightly run: 0 failures in the last 53 PR runs, and it is
  # not a required check.
  pull_request:
    paths:
      - "cmd/corral-wasm/**"
      - "pkg/web/**"
      - "pkg/demo/**"
      - "web-demo/**"
      - "scripts/build-web-demo.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-demo.yml"
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      # The serve() bridge between sw.js and the Go dashboard only builds for
      # js/wasm, so the main test job never runs it. Node (preinstalled on
      # the runner) executes the test binary.
      - name: Test the wasm bridge
        run: GOOS=js GOARCH=wasm go test -count=1 -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./cmd/corral-wasm/
      - name: Build the site
        run: scripts/build-web-demo.sh dist/web-demo
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/web-demo

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CORRAL_WEB_DEMO_PAGES == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
