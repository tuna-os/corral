# Browser demo site (#284): the dashboard compiled to WebAssembly, served by a
# service worker against the in-memory demo cluster. See web-demo/README.md.
#
# Every run builds the site, so a change that breaks the js/wasm build fails
# here. Pushes to main also publish it to GitHub Pages, but only once a
# maintainer opts in: Pages source set to "GitHub Actions" and the repository
# variable CORRAL_WEB_DEMO_PAGES set to "true".
name: web-demo

on:
  push:
    branches: [main]
    paths:
      - "cmd/corral-wasm/**"
      - "pkg/**"
      - "web-demo/**"
      - "scripts/build-web-demo.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-demo.yml"
  pull_request:
    paths:
      - "cmd/corral-wasm/**"
      - "pkg/**"
      - "web-demo/**"
      - "scripts/build-web-demo.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/web-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build the site
        run: scripts/build-web-demo.sh dist/web-demo
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web-demo

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CORRAL_WEB_DEMO_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
