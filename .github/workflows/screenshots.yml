name: Screenshots

# Keeps the documentation screenshots in step with the interface (#291).
#
# scripts/capture-docs.mjs drives the real `--demo` fleet in headless Chromium
# and tmux, so the captures need no cluster and no KVM. This workflow runs it
# whenever the web UI, the TUI or the demo fleet changes, and weekly as a
# backstop, then prepares the new images for review:
#
# - here, a patch for a maintainer PR into docs/screenshots/generated/;
# - in tuna-os/docs, into static/img/screenshots/corral/ (tunaos.org/corral).
#   That repo's sync copies Markdown, not images, so without this the landing
#   page keeps whatever was last copied by hand. The step needs a token that
#   can push to tuna-os/docs: set the repository secret TUNAOS_DOCS_TOKEN to
#   enable it. With none set the job says so and stops.
#
# The Corral handoff never pushes, creates or approves a PR: maintainers
# review the patch and open the PR themselves (#634). The optional site PR
# reuses a fixed branch. On pull_request only capture and upload run.

on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "pkg/web/**"
      - "pkg/demo/**"
      - "scripts/capture-docs.mjs"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - ".github/workflows/screenshots.yml"
  pull_request:
    paths:
      - "scripts/capture-docs.mjs"
      - "e2e/package.json"
      - "e2e/package-lock.json"
      - ".github/workflows/screenshots.yml"
  schedule:
    # Mondays 05:23 UTC: off the hour, and after the nightly run.
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Build corral
        run: go build -o corral .

      # tmux hosts the TUI so its screen can be read back as text.
      - name: Install tmux and Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux
          npm ci --prefix e2e
          (cd e2e && npx playwright install --with-deps chromium)

      - name: Capture screenshots
        run: node scripts/capture-docs.mjs "$RUNNER_TEMP/screenshots"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: error

  corral-handoff:
    needs: capture
    if: github.event_name != 'pull_request' && github.repository == 'tuna-os/corral'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: screenshots
          path: docs/screenshots/generated

      - name: Prepare the maintainer patch
        id: patch
        run: |
          git add -- docs/screenshots/generated/*.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Corral screenshot changes." >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --cached --binary -- docs/screenshots/generated/ > "$RUNNER_TEMP/screenshots.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the maintainer patch
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: corral-screenshot-patch
          path: ${{ runner.temp }}/screenshots.patch
          if-no-files-found: error

      - name: Request a maintainer PR
        if: steps.patch.outputs.changed == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          echo "::notice::Screenshot changes captured; no PR was created. A maintainer must download corral-screenshot-patch, review it, and open a PR (see the job summary). Do not enable Actions self-approval."
          {
            echo '### Maintainer action required — no PR created'
            echo "Screenshots captured from \`$SOURCE_SHA\`. Download the patch into a temporary directory:"
            echo '```sh'
            echo "gh run download $RUN_ID --repo tuna-os/corral --name corral-screenshot-patch --dir /tmp/corral-screenshot-$RUN_ID"
            echo '```'
            echo 'In a clean Corral checkout, create a branch from current main and review/apply the patch:'
            echo '```sh'
            echo 'git fetch origin main'
            echo "git switch -c docs/screenshots-$RUN_ID origin/main"
            echo "git apply --check /tmp/corral-screenshot-$RUN_ID/screenshots.patch"
            echo "git apply --index /tmp/corral-screenshot-$RUN_ID/screenshots.patch"
            echo 'git diff --cached --stat'
            echo '```'
            echo 'Inspect every changed image. If the patch no longer applies, rerun capture against current main rather than forcing it.'
            echo "Commit and push only the reviewed screenshot changes, then open a PR with \`gh pr create --base main\`. Human review and all required checks still apply; this workflow neither approves nor merges."
          } >> "$GITHUB_STEP_SUMMARY"

  site-pr:
    needs: capture
    if: github.event_name != 'pull_request' && github.repository == 'tuna-os/corral'
    runs-on: ubuntu-26.04
    steps:
      - name: Check the site token is configured
        id: token
        env:
          TUNAOS_DOCS_TOKEN: ${{ secrets.TUNAOS_DOCS_TOKEN }}
        run: |
          if [ -z "$TUNAOS_DOCS_TOKEN" ]; then
            echo "::notice::TUNAOS_DOCS_TOKEN is not set — skipping the tunaos.org screenshots PR. Set it to a token that can push to tuna-os/docs and open PRs there to enable this job."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.configured == 'true'
        with:
          repository: tuna-os/docs
          token: ${{ secrets.TUNAOS_DOCS_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.token.outputs.configured == 'true'
        with:
          name: screenshots
          path: static/img/screenshots/corral

      - name: Open or update the tunaos.org screenshots PR
        if: steps.token.outputs.configured == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.TUNAOS_DOCS_TOKEN }}
          commit-message: "chore: refresh Corral screenshots"
          title: "chore: refresh Corral screenshots"
          body: |
            Automated capture of the Corral `--demo` fleet from
            tuna-os/corral@${{ github.sha }} (`scripts/capture-docs.mjs`,
            run by `.github/workflows/screenshots.yml` there).
            Check the images before merging.
          branch: automation/corral-screenshots
          delete-branch: true
          add-paths: static/img/screenshots/corral/*.png
          labels: documentation
