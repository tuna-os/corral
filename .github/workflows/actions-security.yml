name: actions-security

# Both jobs read only .github/ (workflows, local composite actions, the lock
# file, dependabot/zizmor config) plus any nested .github/ tree or action.yml
# zizmor may discover, so a pull request that changes none of those cannot
# change either result and the run is not started. Pushes to main and
# manual runs are unfiltered. Not a required check, so a skipped run blocks
# nothing.
on:
  pull_request:
    paths:
      - '.github/**'
      - '**/.github/**'
      - '**/action.yml'
      - '**/action.yaml'
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  # Security lint for workflows. Fails on any finding.
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
          annotations: true
