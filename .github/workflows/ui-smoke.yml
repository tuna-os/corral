# UI smoke: build corral, serve the dashboard against the built-in --demo
# fake cluster, and drive it with headless Chromium (scripts/ui-smoke.mjs).
# No cluster, no KVM — runs anywhere. This is the regression net for the
# frontend + demo seam.
name: ui-smoke

on:
  push:
    branches: [main]
    paths:
      - "pkg/web/**"
      - "pkg/demo/**"
      - "scripts/ui-smoke.mjs"
      - ".github/workflows/ui-smoke.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26

      # Before the Playwright step: its `npm init` writes a package.json at the
      # root, and that would make Node load the client's .js files as CommonJS.
      - name: Web client unit tests
        run: node --test pkg/web/jstest/*.test.mjs

      - name: Build corral
        run: go build -o corral .

      - name: Install Playwright Chromium
        run: | # zizmor: ignore[adhoc-packages] repo has no npm lockfile, smoke test installs Playwright on purpose
          npm init -y >/dev/null
          npm install --no-save playwright >/dev/null
          npx playwright install --with-deps chromium

      - name: Serve demo dashboard
        run: |
          ./corral web --demo --addr 127.0.0.1:8899 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8899/ && break
            sleep 1
          done

      - name: UI smoke
        run: node scripts/ui-smoke.mjs

      - name: Upload grid acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: grid-columns
          path: grid-columns.png
          if-no-files-found: ignore

      # Named checks save what they saw (e.g. command-palette.png), so a
      # reviewer can look at a UI change without running it.
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-smoke-screenshots
          path: ui-smoke-screenshots/
          if-no-files-found: ignore
