# Corral web UI — Proxmox-style dashboard for KubeVirt, served in-cluster.
# Image: built from the corral repo Containerfile, pushed to
# ghcr.io/tuna-os/corral (public — no pull secret needed).
# Reachable at https://corral.<tailnet>.ts.net via the Tailscale operator
# (Ingress with ingressClassName: tailscale terminates HTTPS). No operator
# (it needs an OAuth client)? Apply deploy/corral-web-tailscale-proxy.yaml
# next to this file instead; it serves the same name from a tailscale pod.
#
# Updates: the image tracks main (:latest, pulled Always). After a release,
#   kubectl -n corral rollout restart deploy/corral-web
# Rollback or pin: kubectl -n corral set image deploy/corral-web \
#   corral-web=ghcr.io/tuna-os/corral@sha256:<digest>
---
apiVersion: v1
kind: Namespace
metadata:
  name: corral
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: corral-web
  namespace: corral
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: corral-web
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources:
      - virtualmachines/start
      - virtualmachines/stop
      - virtualmachines/restart
      - virtualmachines/migrate
      - virtualmachines/addvolume
      - virtualmachines/removevolume
      - virtualmachineinstances/vnc
      - virtualmachineinstances/console
      - virtualmachineinstances/pause
      - virtualmachineinstances/unpause
      - virtualmachineinstances/guestosinfo
      - virtualmachineinstances/filesystemlist
      - virtualmachineinstances/userlist
    verbs: ["get", "update"]
  # Snapshot / restore / clone / export (Proxmox-parity ops)
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots", "virtualmachinerestores"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["clone.kubevirt.io"]
    resources: ["virtualmachineclones"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["export.kubevirt.io"]
    resources: ["virtualmachineexports"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "create", "delete"]
  # PVC: create (new disks), patch (online expand), delete (cleanup)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "patch", "update", "delete"]
  # Capability detection (storage classes + snapshot classes)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshots"]
    verbs: ["get", "list"]
  # Export download: virtctl vmexport --port-forward needs the token secret +
  # a port-forward to the exporter pod.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete"]
  # User-defined custom image/ISO sources persist in a ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Bootc builder reads pod logs to extract build variables.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # VDI claims (#226, #227): one Lease per desktop pool member. The opt-in
  # broker (CORRAL_VDI_BROKER) claims, renews, and releases them.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
  # Events tab (Proxmox-style task log) + live metrics on the summary
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Instancetype/preference pickers in the create wizard
  - apiGroups: ["instancetype.kubevirt.io"]
    resources: ["virtualmachineclusterinstancetypes", "virtualmachineclusterpreferences"]
    verbs: ["get", "list"]
  # Bootc builder creates jobs to build VM disks on-cluster.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  # Tailscale operator detection (ApplyProxy): tailscaleOperatorPresent() checks
  # for the `tailscale` IngressClass the operator registers.
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list"]
  # Per-VM Tailscale operator proxy (ApplyProxy): create the SA/Role/RoleBinding/
  # Service/Deployment that expose a VM on the tailnet; VM deletion cleans them up.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Per-VM proxy + schedule RBAC (ApplyProxy/DeleteProxy, cronops): the only
  # Role/RoleBinding objects corral-web ever creates are namespaced ones named
  # corral-<vm>-proxy or corral-sched — never ClusterRoles or ClusterRoleBindings,
  # and the proxy Role it grants holds only vmi get + vnc get (see
  # GenerateProxyRBAC). Cluster scope (rather than a Role in the corral
  # namespace) is required because VM namespaces are dynamic per create (-n);
  # there is no static namespace list to bind to. `list` is deliberately
  # absent: no code path lists roles/rolebindings (apply + get + delete only).
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: corral-web
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: corral-web
subjects:
  - kind: ServiceAccount
    name: corral-web
    namespace: corral
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: corral-web
  namespace: corral
  labels:
    app: corral-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: corral-web
  template:
    metadata:
      labels:
        app: corral-web
    spec:
      serviceAccountName: corral-web
      containers:
        - name: corral-web
          # :latest is what main publishes; Always makes each rollout
          # restart pull the newest build (see the header for the update path).
          image: ghcr.io/tuna-os/corral:latest
          imagePullPolicy: Always
          # --metrics starts the background fleet collector and serves
          # Prometheus text exposition on /metrics (ADR-0011, pkg/web/prometheus.go).
          # Without it the endpoint exists but always renders corral_collection_success 0:
          # the collector that would populate it never runs.
          args: ["--metrics"]
          env:
            # This deployment manages its Kubernetes cluster by default. Other
            # configured contexts remain visible in the aggregated inventory.
            - name: CORRAL_DEFAULT_BACKEND
              value: kubevirt
            # Default VM namespace (code default is corral-vms).
            # Override with CORRAL_NAMESPACE=custom-ns if needed.
            - name: CORRAL_NAMESPACE
              value: corral-vms
            # Admin allowlist (comma-separated tailnet logins). When unset,
            # the UI is single-user/open. When set, only these logins may
            # perform mutating actions; everyone else is read-only. Identity
            # comes from the Tailscale ingress (see docs/adr/0003).
            # SECURITY: this trusts the Tailscale-User-Login header, which is
            # only safe because all traffic reaches this pod via the Tailscale
            # operator Ingress. Do not add a second, non-Tailscale ingress path.
            # - name: CORRAL_ADMINS
            #   value: "alice@github,bob@github"
          ports:
            - containerPort: 8006
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8006
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8006
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: corral-web
  namespace: corral
spec:
  selector:
    app: corral-web
  ports:
    - name: http
      port: 80
      targetPort: 8006
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: corral-web
  namespace: corral
spec:
  defaultBackend:
    service:
      name: corral-web
      port:
        number: 80
  ingressClassName: tailscale
  tls:
    - hosts:
        - corral
